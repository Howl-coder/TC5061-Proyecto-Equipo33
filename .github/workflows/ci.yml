name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-e-imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
            requirements-load.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -r requirements-api.txt -r requirements-load.txt
      - name: Ejecutar pruebas
        run: |
          python -m pytest -v tests
          python -m pytest -v load_tests/test_locustfile.py
      - name: Generar modelo sintético para CI
        run: python -m scripts.generar_modelo_ci models/servicio
      - name: Construir y comprobar la imagen
        run: bash scripts/probar_contenedor.sh docker 8000 mibici-prueba-ci 1
      - name: Iniciar API con Compose
        run: docker compose up --build --wait --wait-timeout 90 api
      - name: Comprobar carga con Locust
        run: |
          python -m locust -f load_tests/locustfile.py --headless \
            --host http://127.0.0.1:8000 --users 2 --spawn-rate 2 \
            --run-time 15s --only-summary --exit-code-on-error 1 \
            --csv "$RUNNER_TEMP/locust-ci"
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "locust-ci_stats.csv"
          with path.open(encoding="utf-8", newline="") as stream:
              aggregate = next(row for row in csv.DictReader(stream) if row["Name"] == "Aggregated")
          if int(aggregate["Request Count"]) < 1 or int(aggregate["Failure Count"]) != 0:
              raise SystemExit("Locust no completó solicitudes exitosas sin fallos")
          PY
      - name: Guardar resultados de carga
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-ci
          path: ${{ runner.temp }}/locust-ci*.csv
          if-no-files-found: ignore
      - name: Mostrar registros de Compose ante fallos
        if: failure()
        run: docker compose logs api
      - name: Detener servicios de Compose
        if: always()
        run: docker compose down --remove-orphans

  validacion-de-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Instalar dependencias de validación
        run: python -m pip install -r requirements-validation.txt
      - name: Ejecutar pruebas de DeepChecks
        run: python -m pytest tests/test_data_validation.py -v

  publicar-imagen:
    needs: [pruebas-e-imagen, validacion-de-datos]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publicar-imagen-ghcr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Instalar dependencias de exportación
        run: python -m pip install -r requirements-api.txt
      - name: Verificar que el paquete GHCR sea privado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER_TYPE=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.owner.type')
          PACKAGE="${GITHUB_REPOSITORY#*/}"
          PACKAGE="${PACKAGE,,}"
          if [ "$OWNER_TYPE" = "Organization" ]; then
            SCOPE=orgs
          else
            SCOPE=users
          fi
          if ! VISIBILITY=$(gh api "$SCOPE/$GITHUB_REPOSITORY_OWNER/packages/container/$PACKAGE" --jq '.visibility'); then
            echo "Crea previamente un paquete privado GHCR y concede acceso al repositorio." >&2
            exit 1
          fi
          if [ "$VISIBILITY" != "private" ]; then
            echo "El paquete GHCR debe ser privado para publicar el modelo." >&2
            exit 1
          fi
      - name: Exportar modelo champion desde el Registry
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          uri = os.environ.get("MLFLOW_TRACKING_URI", "")
          if urlparse(uri).scheme != "https" or not urlparse(uri).hostname:
              raise SystemExit("Configura el secreto MLFLOW_TRACKING_URI con una URL HTTPS accesible.")
          PY
          python -m src.model_package --pregunta p1
      - name: Verificar linaje del modelo y probar imagen
        run: |
          VERSION=$(python -m scripts.validar_modelo_publicacion)
          echo "MODEL_VERSION=$VERSION" >> "$GITHUB_ENV"
          bash scripts/probar_contenedor.sh docker 8000 mibici-equipo33-p1-demanda "$VERSION"
      - name: Publicar imagen validada en GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="sha-${GITHUB_SHA}-model-${MODEL_VERSION}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag mibici-api:latest "$IMAGE:$TAG"
          docker tag mibici-api:latest "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Imagen publicada: $IMAGE:$TAG"
